[project]
name = "ptcg-card-training"
version = "0.1.0"
description = "Synthetic dataset generation and YOLO training for Pokemon TCG card detection"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "ultralytics>=8.3.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
# Web tester for inspecting model predictions interactively.
#   uv sync --extra serve
serve = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
]

# TFJS + ONNX export pulls heavy deps. Install on demand:
#   uv sync --extra export
export = [
    "onnx>=1.16.0",
    "onnxslim>=0.1.34",
    "onnxruntime>=1.17.0",
    # onnx>=1.18 needs the float4 dtype from ml_dtypes 0.5+. TF pins it to <0.5,
    # so old TF installs in the same venv break ONNX export.
    "ml_dtypes>=0.5.0",
]

# TFJS export is brittle (TF + TF-DF + protobuf version conflicts on 3.12).
# Install separately only if you actually need TFJS — never alongside `export`:
#   uv sync --extra export-tfjs
# Requires Python 3.11 in practice today.
export-tfjs = [
    "tensorflow>=2.16.0,<2.20.0",
    "tensorflowjs>=4.20.0",
    "tensorflow_decision_forests<1.10",
]

# `export` (needs ml_dtypes>=0.5) and `export-tfjs` (TF pins ml_dtypes<0.4) are
# mutually exclusive. Tell uv so it resolves them in separate environments
# instead of trying to satisfy both at once.
[tool.uv]
conflicts = [
    [{ extra = "export" }, { extra = "export-tfjs" }],
]

# RTX 5090 / Blackwell needs a CUDA 12.8-capable PyTorch build. PyTorch's
# official 2.8 CUDA wheel pair is torch==2.8.0 + torchvision==0.23.0 from cu128.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
