[project]
name = "ptcg-obb-training"
version = "0.1.0"
description = "Synthetic dataset generation and YOLO-OBB training for Pokémon TCG card detection"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
# TFJS + ONNX export pulls heavy deps. Install on demand:
#   uv sync --extra export
export = [
    "onnx>=1.16.0",
    "onnxslim>=0.1.34",
    "onnxruntime>=1.17.0",
]

# TFJS export is brittle (TF + TF-DF + protobuf version conflicts on 3.12).
# Install separately only if you actually need TFJS:
#   uv sync --extra export --extra export-tfjs
# Requires Python 3.11 in practice today.
export-tfjs = [
    "tensorflow>=2.16.0,<2.20.0",
    "tensorflowjs>=4.20.0",
    "tensorflow_decision_forests<1.10",
]

# For CUDA torch, add to pyproject.toml *before* `uv sync`:
#
#   [[tool.uv.index]]
#   name = "pytorch-cu121"
#   url = "https://download.pytorch.org/whl/cu121"
#   explicit = true
#
#   [tool.uv.sources]
#   torch = { index = "pytorch-cu121" }
#   torchvision = { index = "pytorch-cu121" }
